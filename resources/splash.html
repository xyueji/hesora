<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>禾序进销存</title>
<style>
  :root {
    --bg: #F5F7F3;
    --ink: #2E3A2F;
    --muted: #6B7A6B;
    --green: #4C7A57;
    --green-light: #A8C3A0;
    --track: #E3E9DF;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .card { width: 320px; text-align: center; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 13px;
    background: var(--green);
    position: relative;
    box-shadow: 0 6px 16px rgba(76, 122, 87, .22);
  }
  .mark::before {
    content: ""; position: absolute;
    left: 14px; top: 12px; width: 8px; height: 22px;
    background: #fff; border-radius: 3px;
    transform: skewY(-18deg);
  }
  .mark::after {
    content: ""; position: absolute;
    left: 25px; top: 12px; width: 8px; height: 22px;
    background: rgba(255, 255, 255, .72); border-radius: 3px;
    transform: skewY(-18deg);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .slogan { margin: 6px 0 26px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .status { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .track {
    height: 5px; width: 100%; border-radius: 3px;
    background: var(--track); overflow: hidden;
  }
  .bar {
    height: 100%; width: 38%; border-radius: 3px;
    background: linear-gradient(90deg, var(--green-light), var(--green));
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar { width: 100%; animation: none; opacity: .8; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>禾序进销存</h1>
    <p class="slogan">货有数 · 账有序</p>
    <p class="status">正在启动…</p>
    <div class="track" role="progressbar" aria-label="正在启动">
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
